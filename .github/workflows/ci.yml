name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flake-check:
    name: Flake Schema & Purity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check Flake Schema & Lockfile
        run: nix flake check --no-build --all-systems

  matrix-build:
    name: Build & Verify (${{ matrix.system }} -> ${{ matrix.target }})
    needs: flake-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target: [aarch64-android, x86_64-android]
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Setup Cachix (if secret configured)
        uses: cachix/cachix-action@v15
        with:
          name: bionic-pkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run Target ELF Verification Checks (${{ matrix.target }})
        run: |
          checks=$(nix eval --raw .#checks.${{ matrix.system }} --apply "checks: builtins.concatStringsSep \" \" (builtins.map (name: \".#checks.${{ matrix.system }}.\${name}\") (builtins.filter (name: !(builtins.isNull (builtins.match \".*${{ matrix.target }}.*\" name))) (builtins.attrNames checks)))")
          if [ -n "$checks" ]; then
            echo "Building checks for target ${{ matrix.target }}: $checks"
            nix build $checks --print-build-logs
          else
            echo "No checks found for target ${{ matrix.target }}"
          fi

      - name: Verify ADB Push Apps Evaluation
        run: |
          nix eval .#apps.${{ matrix.system }} --apply builtins.attrNames
