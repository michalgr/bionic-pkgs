name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flake-check:
    name: Flake Schema & Purity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check Flake Schema & Lockfile
        run: nix flake check --no-build --all-systems

  verify-apps:
    name: Verify ADB Push Apps Evaluation (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Verify ADB Push Apps Evaluation
        run: |
          nix eval .#apps.${{ matrix.system }} --apply builtins.attrNames

  matrix-build:
    name: Build & Verify (${{ matrix.system }} -> ${{ matrix.target }})
    needs: flake-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target: [aarch64-android, x86_64-android]
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Setup Cachix (if secret configured)
        uses: cachix/cachix-action@v15
        with:
          name: bionic-pkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run Target ELF Verification Checks (${{ matrix.target }})
        run: |
          checks=$(nix eval --raw .#checks.${{ matrix.system }} --apply "checks: builtins.concatStringsSep \" \" (builtins.map (name: \".#checks.${{ matrix.system }}.\${name}\") (builtins.filter (name: !(builtins.isNull (builtins.match \".*${{ matrix.target }}.*\" name))) (builtins.attrNames checks)))")
          if [ -n "$checks" ]; then
            echo "Building checks for target ${{ matrix.target }}: $checks"
            nix build $checks --print-build-logs
          else
            echo "No checks found for target ${{ matrix.target }}"
          fi

      - name: Build Target Archives (${{ matrix.target }})
        if: matrix.system == 'x86_64-linux'
        run: |
          case "${{ matrix.target }}" in
            aarch64-android)
              arch="aarch64"
              ;;
            x86_64-android)
              arch="x86_64"
              ;;
            *)
              arch="${{ matrix.target }}"
              ;;
          esac

          echo "Building sysroot and bpftrace-static archive for ${{ matrix.target }} ($arch)..."
          nix build .#${{ matrix.target }}-sysroot --out-link result-sysroot --print-build-logs
          nix build .#${{ matrix.target }}-bpftrace-static-archive --out-link result-bpftrace --print-build-logs

          mkdir -p dist
          cp result-sysroot/sysroot-${arch}.tar.gz dist/
          cp result-bpftrace/bpftrace-static-${arch}.tar.gz dist/

          ls -lh dist/

      - name: Upload Target Archives (${{ matrix.target }})
        if: matrix.system == 'x86_64-linux'
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  emulator-test-x86_64:
    name: Android Emulator Test (x86_64)
    needs: matrix-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Target Archives (x86_64-android)
        uses: actions/download-artifact@v4
        with:
          name: archives-x86_64-android
          path: dist/

      - name: Run Emulator Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: ./scripts/ci-emulator-test.sh dist
