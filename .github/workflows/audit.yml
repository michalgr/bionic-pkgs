name: Audit / Toolchain Flags & Dependencies

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: Inspect & Audit (${{ matrix.system }} -> ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target: [aarch64-android, x86_64-android]
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: bionic-pkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Inspect & Verify Toolchain Flags
        run: |
          nix build .#${{ matrix.target }}.verify-flags
          cat ./result/flags.log

      - name: Audit Dependency Graph & List Projects
        run: |
          bash scripts/list-deps.sh "${{ matrix.target }}" "${{ matrix.system }}"
