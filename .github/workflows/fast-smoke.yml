name: Parallel Tool Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  parallel-tool-smoke:
    name: Tool Verification (${{ matrix.tool }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tool: [strace, python3, radare2, rizin, elfutils, bpftrace, bcc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          use-flakehub: false

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: bionic-pkgs
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Target Static ELF Check (${{ matrix.tool }})
        run: |
          nix build .#checks.x86_64-linux.check-elf-x86_64-android-${{ matrix.tool }}

      - name: Enable KVM permissions
        run: sudo chmod 666 /dev/kvm

      - name: Run Emulator Tool Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          enable-hw-accel: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-metrics -no-snapshot-save -camera-back none
          script: |
            echo "==> Deploying ${{ matrix.tool }} to emulator..."
            nix run .#push-x86_64-android-${{ matrix.tool }}
            echo "==> Running codified test for ${{ matrix.tool }}..."
            ./tests/tools/test-${{ matrix.tool }}.sh --bin /data/local/tmp/bionic-pkgs/${{ matrix.tool }}/run.sh
