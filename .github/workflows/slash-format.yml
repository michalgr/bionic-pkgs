name: Bot / Slash Command (Format)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  format:
    name: Execute /format
    if: |
      github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/format') || startsWith(github.event.comment.body, '/nixfmt')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.user.login == 'michalgr' ||
       github.event.comment.user.login == 'google-labs-jules[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge Command
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Fetch PR Details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            return {
              ref: pr.data.head.ref,
              repo_full_name: pr.data.head.repo.full_name,
              is_fork: pr.data.head.repo.fork
            };

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJson(steps.pr.outputs.result).repo_full_name }}
          ref: ${{ fromJson(steps.pr.outputs.result).ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          use-flakehub: false

      - name: Run Formatter
        run: nix fmt

      - name: Commit and Push Changes
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "style(format): apply nixfmt via /format command"
            git push origin "HEAD:${{ fromJson(steps.pr.outputs.result).ref }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CI on New Commit
        if: steps.commit_step.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prRef = "${{ fromJson(steps.pr.outputs.result).ref }}";
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                ref: prRef
              });
              console.log(`Successfully dispatched ci.yml for ref ${prRef}`);
            } catch (err) {
              console.error(`Failed to dispatch ci.yml: ${err.message}`);
            }

      - name: React on Completion
        uses: actions/github-script@v7
        with:
          script: |
            const changed = "${{ steps.commit_step.outputs.changed }}" === "true";
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: changed ? 'hooray' : 'thumbsup'
            });
